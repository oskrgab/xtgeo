name: WASM (Pyodide)

# Cross-compiles xtgeo to an Emscripten/Pyodide wheel and proves it in Node +
# Pyodide. Separate from publish.yml (the cibuildwheel PyPI matrix), which this
# workflow never touches: this is a SINGLE target -- one pinned Pyodide release
# -> one CPython -> one emscripten_wasm32 wheel (see wasm/versions.env).
#
#   * pull_request (native/build paths) -> build + smoke, no publish
#   * workflow_dispatch / wasm-v* tag   -> build + smoke + GitHub Release asset
#
# The build runs `make wasm`, which builds and runs the SAME pinned Docker image
# used locally (versions sourced from wasm/versions.env) -- so CI == local.

on:
  pull_request:
    paths:
      - "src/lib/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "wasm/**"
      - "Makefile"
      - ".github/workflows/wasm.yml"
  workflow_dispatch:
  push:
    tags:
      - "wasm-v*"

# Least privilege by default; the release job opts into contents: write.
permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # setuptools_scm derives the wheel version from git history/tags.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the Emscripten wheel (pinned Docker image)
        run: make wasm

      - name: Smoke-test in Node + Pyodide
        # run_smoke_test.sh shallow-clones equinor/xtgeo-testdata for the REEK
        # fixtures and exits non-zero if any check fails -> fails the workflow.
        run: make wasm-smoke

      - uses: actions/upload-artifact@v7
        with:
          name: xtgeo-wasm-wheel
          path: dist/wasm/*.whl
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # Only publish on a manual dispatch or a wasm-v* tag -- never on PRs.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/wasm-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xtgeo-wasm-wheel
          path: dist/wasm

      - name: Resolve release tag
        id: tag
        # Tag pushes publish under their own tag; a manual dispatch refreshes a
        # rolling "wasm-latest" pre-release pointing at the dispatched commit.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=wasm-latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: dist/wasm/*.whl
          fail_on_unmatched_files: true
